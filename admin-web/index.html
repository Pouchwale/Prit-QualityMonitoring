<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Industrial Quality Monitoring System for printing and packaging manufacturing operations. Real-time periodic checks, dynamic parameters, live evidence capture, and exception workflows." />
    <title>Quality Monitoring — Admin Panel</title>
    <!-- Saved theme (lib/theme.ts) applied before the first paint, so dark mode never flashes white -->
    <script>
      try {
        if (localStorage.getItem('qa-admin-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
      } catch (e) {}
    </script>
  </head>
  <body class="bg-canvas text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
